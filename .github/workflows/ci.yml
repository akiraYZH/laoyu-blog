name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: >
          dotnet restore
          tests/LaoyuBlog.Api.Tests/LaoyuBlog.Api.Tests.csproj

      - name: Build
        run: >
          dotnet build
          tests/LaoyuBlog.Api.Tests/LaoyuBlog.Api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          tests/LaoyuBlog.Api.Tests/LaoyuBlog.Api.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint
        run: npx --no-install oxlint .

      - name: Run ESLint
        run: npx --no-install eslint . --no-cache

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Production build
        run: npm run build-only
