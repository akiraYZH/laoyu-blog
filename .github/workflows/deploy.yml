name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: laoyu-blog-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Deploy through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy ${GITHUB_SHA}" \
              --timeout-seconds 1800 \
              --parameters '{"commands":["sudo -u ubuntu git -C /home/ubuntu/apps/laoyu-blog pull --ff-only origin main","sudo -u ubuntu make -C /home/ubuntu/apps/laoyu-blog prod-up","sudo -u ubuntu make -C /home/ubuntu/apps/laoyu-blog prod-ps"]}' \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command: $COMMAND_ID"

          STATUS="Pending"

          for attempt in {1..180}; do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null \
              || echo "Pending"
            )"

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status: Status,
              ResponseCode: ResponseCode,
              StandardOutput: StandardOutputContent,
              StandardError: StandardErrorContent
            }' \
            --output json

          test "$STATUS" = "Success"
